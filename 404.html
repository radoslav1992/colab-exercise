<!doctype html>
<!-- What the server answers for an address that is not a page (wrangler.jsonc: "not_found_handling": "404-page"). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/landing.css" />
    <title>Page not found · Notebook Lab</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <main class="lost-page">
      <!-- doodle:not-found -->
      <h1>Page not found</h1>
      <p>There is nothing at this address.</p>
      <p class="calls">
        <a class="button primary" href="/">Go to the start</a>
        <a class="button" href="/playground">Open the playground</a>
      </p>
    </main>
  </body>
</html>
