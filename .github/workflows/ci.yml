name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The sample notebooks are executed under ordinary Python with NumPy (tests/python).
      - run: pip install numpy
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Bundles the Worker and checks wrangler.jsonc. Uploads nothing and needs no Cloudflare account.
      - run: npx wrangler deploy --dry-run
